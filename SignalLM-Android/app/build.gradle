plugins {
    id 'com.android.application'
}

android {
    namespace 'com.signallm.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.signallm.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
