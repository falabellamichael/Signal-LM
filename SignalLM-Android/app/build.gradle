plugins {
    id 'com.android.application'
}

import java.nio.file.Files
import org.gradle.process.ExecOperations

def signalLmEnableVulkan = providers.gradleProperty('SIGNAL_LM_ENABLE_VULKAN').orElse('AUTO')

android {
    namespace 'com.signallm.app'
    compileSdk 36

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    defaultConfig {
        applicationId 'com.signallm.app'
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName '1.0.5.7'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments "-DSIGNAL_LM_ENABLE_VULKAN=${signalLmEnableVulkan.get()}"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Fresh GitHub source/package downloads do not include third-party vendored code.
// This task makes Android package builds self-preparing by cloning llama.cpp before CMake configures.
def llamaRepoUrl = 'https://github.com/ggml-org/llama.cpp.git'
def llamaRef = providers.gradleProperty('SIGNAL_LM_LLAMA_REF').orElse('master')
def thirdPartyDir = file('src/main/cpp/third_party')
def llamaDir = file('src/main/cpp/third_party/llama.cpp')
def pinFile = file('../LLAMA_CPP_PIN.txt')

tasks.register('vendorLlamaCpp') {
    group = 'signal lm'
    description = 'Clone or update llama.cpp for Android native inference builds.'
    outputs.dir(llamaDir)

    doLast {
        def execOps = services.get(ExecOperations)
        thirdPartyDir.mkdirs()
        def ref = llamaRef.get()
        if (!new File(llamaDir, '.git').exists()) {
            if (llamaDir.exists()) {
                logger.lifecycle('Removing incomplete llama.cpp vendor directory: ' + llamaDir)
                delete llamaDir
            }
            logger.lifecycle('Cloning llama.cpp into ' + llamaDir)
            execOps.exec {
                commandLine 'git', 'clone', '--depth', '1', '--branch', ref, llamaRepoUrl, llamaDir.absolutePath
            }
        } else {
            logger.lifecycle('Updating existing llama.cpp checkout at ' + llamaDir)
            execOps.exec { workingDir llamaDir; commandLine 'git', 'fetch', '--depth', '1', 'origin', ref }
            execOps.exec { workingDir llamaDir; commandLine 'git', 'checkout', 'FETCH_HEAD' }
        }

        def stdout = new ByteArrayOutputStream()
        execOps.exec {
            workingDir llamaDir
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = stdout
        }
        def commit = stdout.toString('UTF-8').trim()
        pinFile.text = "repo=${llamaRepoUrl}\nref=${ref}\ncommit=${commit}\npath=app/src/main/cpp/third_party/llama.cpp\n"
        logger.lifecycle('llama.cpp ready at commit ' + commit)
    }
}

tasks.matching { task ->
    task.name.startsWith('configureCMake') ||
    task.name.startsWith('externalNativeBuild') ||
    task.name == 'preBuild'
}.configureEach { task ->
    task.dependsOn tasks.named('vendorLlamaCpp')
}

dependencies {
}
