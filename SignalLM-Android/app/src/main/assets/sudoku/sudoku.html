<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="sudoku.css">
</head>
<body>
    <div class="container">
        <h1>🔢 Sudoku</h1>

        <div class="difficulty-selector">
            <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="newGame()">New Game</button>
            <button class="btn-secondary" onclick="checkSolution()">Check</button>
            <button class="btn-secondary" onclick="hint()">Hint</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="moves">0</div>
                <div class="stat-label">Moves</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="time">0:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div id="board"></div>

        <div class="keyboard">
            <div class="keyboard-label">Number Pad</div>
            <div class="keyboard-grid">
                <button class="key-btn" onclick="inputNumber(1)">1</button>
                <button class="key-btn" onclick="inputNumber(2)">2</button>
                <button class="key-btn" onclick="inputNumber(3)">3</button>
                <button class="key-btn" onclick="inputNumber(4)">4</button>
                <button class="key-btn" onclick="inputNumber(5)">5</button>
                <button class="key-btn" onclick="inputNumber(6)">6</button>
                <button class="key-btn" onclick="inputNumber(7)">7</button>
                <button class="key-btn" onclick="inputNumber(8)">8</button>
                <button class="key-btn" onclick="inputNumber(9)">9</button>
                <button class="key-btn delete" onclick="deleteCell()">⌫</button>
            </div>
        </div>
    </div>

    <script src="sudoku.js"></script>
</body>
</html>
